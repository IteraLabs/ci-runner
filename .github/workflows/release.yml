name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Stage artifact
        id: stage
        run: |
          set -eu
          target=$(rustc -vV | awk '/^host:/{print $2}')
          name="citop-${target}"
          mkdir -p dist
          cp target/release/citop "dist/${name}"
          cd dist
          sha256sum "${name}" > "${name}.sha256"
          sha256sum "${name}" >> SHA256SUMS
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Verify the binary and its version
        run: |
          set -eu
          ./dist/${{ steps.stage.outputs.name }} --help
          got=$(./dist/${{ steps.stage.outputs.name }} --version | cut -d' ' -f1-2)
          test "$got" = "citop ${GITHUB_REF_NAME#v}"

      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/${{ steps.stage.outputs.name }}

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ steps.stage.outputs.name }}
            dist/${{ steps.stage.outputs.name }}.sha256
            dist/SHA256SUMS
